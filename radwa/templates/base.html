{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}myproject - Django Backend{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <a href="{% url 'core:home' %}" class="brand-logo">
                <span class="logo-badge">myproject</span>
            </a>
            <nav class="nav-links">
                <a href="{% url 'core:home' %}" class="nav-link active">Home</a>
                <a href="/admin/" class="nav-link" target="_blank" rel="noopener">Django Admin</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="footer-container">
            <p>&copy; 2026 myproject &bull; Powered by Django &bull; App: <code>core</code></p>
        </div>
    </footer>
</body>
</html>
